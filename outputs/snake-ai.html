<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ثعبان الذكاء الاصطناعي</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #effff7;
      --muted: #a8c5b7;
      --panel: #10271f;
      --panel-2: #16372b;
      --line: #285240;
      --accent: #7cf6b0;
      --accent-dark: #164a30;
      --food: #ff7b8a;
      --warning: #ffe59a;
      --shadow: 0 18px 50px rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 85% 5%, #225740 0, transparent 30%),
        radial-gradient(circle at 5% 95%, #173d31 0, transparent 32%),
        #08140f;
      color: var(--ink);
      font-family: Tahoma, Arial, sans-serif;
    }
    .app { width: min(100%, 780px); }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.25rem); letter-spacing: -.04em; }
    header p { margin: 6px 0 0; color: var(--muted); font-size: .95rem; }
    .badge { background: var(--accent-dark); color: var(--accent); border: 1px solid #2e8956; padding: 7px 11px; border-radius: 99px; white-space: nowrap; font-size: .84rem; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 215px; gap: 16px; }
    .board-wrap, .sidebar { background: rgba(16,39,31,.88); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
    .board-wrap { position: relative; padding: 12px; }
    canvas { display: block; width: 100%; aspect-ratio: 1; border-radius: 12px; background: #0a1b14; touch-action: none; }
    .overlay { position: absolute; inset: 12px; display: grid; place-items: center; text-align: center; background: rgba(5,16,11,.68); border-radius: 12px; transition: opacity .2s; }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay-box { padding: 20px; }
    .overlay strong { display: block; font-size: 1.45rem; margin-bottom: 8px; }
    .overlay span { color: var(--muted); }
    .sidebar { padding: 16px; display: flex; flex-direction: column; gap: 13px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { background: var(--panel-2); border-radius: 12px; padding: 10px; }
    .stat span { display: block; color: var(--muted); font-size: .76rem; margin-bottom: 3px; }
    .stat strong { font-size: 1.35rem; font-variant-numeric: tabular-nums; }
    .label { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .ai-toggle { cursor: pointer; color: var(--ink); background: var(--panel-2); padding: 12px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; }
    .ai-toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
    button { font: inherit; border: 0; border-radius: 11px; cursor: pointer; padding: 11px 12px; color: var(--ink); background: #25483a; transition: transform .12s, background .12s; }
    button:hover { background: #315b49; } button:active { transform: translateY(1px); }
    button.primary { color: #082014; background: var(--accent); font-weight: bold; }
    button.primary:hover { background: #9bffc6; }
    .tips { border-top: 1px solid var(--line); padding-top: 13px; color: var(--muted); font-size: .8rem; line-height: 1.6; }
    kbd { font-family: inherit; padding: 1px 5px; border: 1px solid #4e7d66; border-radius: 5px; color: var(--ink); }
    @media (max-width: 660px) { .layout { grid-template-columns: 1fr; } .sidebar { display: grid; grid-template-columns: 1fr 1fr; } .tips { grid-column: 1 / -1; } }
    @media (max-width: 430px) { body { padding: 14px; } header { align-items: start; flex-direction: column; } .sidebar { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>ثعبان × AI</h1>
        <p>تنافس مع خوارزمية بسيطة، أو اتركها تلعب وحدها.</p>
      </div>
      <div class="badge" id="statusBadge">جاهز للعب</div>
    </header>
    <section class="layout" aria-label="لعبة الثعبان">
      <div class="board-wrap">
        <canvas id="game" width="600" height="600" aria-label="ساحة لعبة الثعبان"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-box"><strong id="overlayTitle">ابدأ اللعبة</strong><span id="overlayText">استخدم الأسهم أو فعّل وضع AI</span></div>
        </div>
      </div>
      <aside class="sidebar">
        <div class="stats">
          <div class="stat"><span>النقاط</span><strong id="score">0</strong></div>
          <div class="stat"><span>الأفضل</span><strong id="best">0</strong></div>
        </div>
        <label class="label" for="speed">السرعة <output id="speedValue">متوسطة</output></label>
        <input id="speed" type="range" min="70" max="220" value="125" step="5" aria-label="سرعة اللعبة" />
        <label class="ai-toggle" for="ai"><span>دع الذكاء الاصطناعي يلعب</span><input id="ai" type="checkbox" /></label>
        <button class="primary" id="restart">لعبة جديدة</button>
        <button id="pause">إيقاف مؤقت</button>
        <div class="tips">
          تحكّم يدويًا عبر <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> <kbd>←</kbd> أو <kbd>WASD</kbd>.<br />
          الـAI يتفادى التصادم أولًا، ثم يختار المسار الأقرب للطعام مع مساحة كافية للهروب.
        </div>
      </aside>
    </section>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const cells = 20;
      const cell = canvas.width / cells;
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const speed = document.getElementById('speed');
      const speedValue = document.getElementById('speedValue');
      const ai = document.getElementById('ai');
      const restart = document.getElementById('restart');
      const pause = document.getElementById('pause');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayText = document.getElementById('overlayText');
      const statusBadge = document.getElementById('statusBadge');
      const directions = { up: {x:0,y:-1}, down: {x:0,y:1}, left: {x:-1,y:0}, right: {x:1,y:0} };
      const opposite = { up:'down', down:'up', left:'right', right:'left' };
      let snake, food, direction, queuedDirection, score, best, running, paused, lastTime, accumulator;
      best = Number(localStorage.getItem('snakeAiBest') || 0);
      bestEl.textContent = best;

      function reset() {
        snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10},{x:7,y:10}];
        direction = 'right'; queuedDirection = 'right'; score = 0;
        food = spawnFood(); running = true; paused = false; accumulator = 0; lastTime = performance.now();
        scoreEl.textContent = score; pause.textContent = 'إيقاف مؤقت'; overlay.classList.add('hidden');
        updateStatus(); draw();
      }
      function spawnFood() {
        const free = [];
        for (let y=0;y<cells;y++) for (let x=0;x<cells;x++) if (!snake.some(p=>p.x===x&&p.y===y)) free.push({x,y});
        return free[Math.floor(Math.random()*free.length)];
      }
      function setDirection(next) {
        if (!running) reset();
        if (next !== opposite[direction]) queuedDirection = next;
      }
      function key(x,y) { return x + ',' + y; }
      function inside(p) { return p.x >= 0 && p.x < cells && p.y >= 0 && p.y < cells; }
      function isSafe(next, assumeTailMoves = true) {
        if (!inside(next)) return false;
        const body = assumeTailMoves ? snake.slice(0,-1) : snake;
        return !body.some(p => p.x === next.x && p.y === next.y);
      }
      function reachableArea(start, blocked) {
        const q = [start], seen = new Set([key(start.x,start.y)]);
        for (let i=0;i<q.length;i++) {
          for (const d of Object.values(directions)) {
            const n={x:q[i].x+d.x,y:q[i].y+d.y}, k=key(n.x,n.y);
            if (inside(n) && !blocked.has(k) && !seen.has(k)) { seen.add(k); q.push(n); }
          }
        }
        return seen.size;
      }
      function chooseAiDirection() {
        const head = snake[0];
        const choices = Object.keys(directions).filter(name => name !== opposite[direction]).map(name => {
          const d=directions[name], next={x:head.x+d.x,y:head.y+d.y};
          if (!isSafe(next)) return {name, bad:true};
          const body = new Set(snake.slice(0,-1).map(p=>key(p.x,p.y)));
          body.add(key(next.x,next.y));
          const area = reachableArea(next, body);
          const distance = Math.abs(next.x-food.x)+Math.abs(next.y-food.y);
          const straight = name === direction ? 0.15 : 0;
          // مساحة قابلة للوصول تمنع التوجه إلى جيب ضيق، والمسافة تجعل القرار يلاحق الطعام.
          const risk = area < snake.length + 6 ? 1000 : 0;
          return {name, bad:false, value: distance * 2 + risk - area * .035 - straight};
        }).filter(c=>!c.bad);
        if (!choices.length) return direction;
        choices.sort((a,b)=>a.value-b.value);
        return choices[0].name;
      }
      function tick() {
        if (!running || paused) return;
        if (ai.checked) queuedDirection = chooseAiDirection();
        direction = queuedDirection;
        const d=directions[direction], next={x:snake[0].x+d.x,y:snake[0].y+d.y};
        const eating = next.x===food.x && next.y===food.y;
        if (!isSafe(next, !eating)) return gameOver();
        snake.unshift(next);
        if (eating) {
          score++; scoreEl.textContent = score;
          if (score > best) { best=score; bestEl.textContent=best; localStorage.setItem('snakeAiBest',best); }
          food=spawnFood();
        } else snake.pop();
        updateStatus(); draw();
      }
      function gameOver() {
        running=false; overlayTitle.textContent='انتهت اللعبة'; overlayText.textContent='نتيجتك '+score+' — اضغط لعبة جديدة للمحاولة ثانيةً'; overlay.classList.remove('hidden'); updateStatus(); draw();
      }
      function updateStatus() {
        const state = !running ? 'انتهت اللعبة' : paused ? 'متوقفة مؤقتًا' : ai.checked ? 'AI يقود الثعبان' : 'تحكم يدوي';
        statusBadge.textContent=state;
      }
      function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='#0a1b14'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle='rgba(124,246,176,.07)'; ctx.lineWidth=1;
        for(let i=1;i<cells;i++) { ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,canvas.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i*cell); ctx.lineTo(canvas.width,i*cell); ctx.stroke(); }
        const pad=2.4;
        ctx.fillStyle='#ff7b8a';
        ctx.beginPath(); ctx.arc((food.x+.5)*cell,(food.y+.5)*cell,cell*.31,0,Math.PI*2); ctx.fill();
        snake.slice().reverse().forEach((p,i) => {
          const isHead=i===snake.length-1; ctx.fillStyle=isHead?'#b2ffd0':'#4bdc86';
          ctx.beginPath(); ctx.roundRect(p.x*cell+pad,p.y*cell+pad,cell-pad*2,cell-pad*2,isHead?7:5); ctx.fill();
          if (isHead) {
            ctx.fillStyle='#082014'; const d=directions[direction];
            const ox=(p.x+.5)*cell+d.x*4, oy=(p.y+.5)*cell+d.y*4;
            const px=d.y*4, py=-d.x*4;
            ctx.beginPath(); ctx.arc(ox+px,oy+py,2.2,0,Math.PI*2); ctx.arc(ox-px,oy-py,2.2,0,Math.PI*2); ctx.fill();
          }
        });
      }
      function loop(now) {
        const interval=Number(speed.value);
        accumulator += now-lastTime; lastTime=now;
        if (accumulator >= interval) { tick(); accumulator %= interval; }
        requestAnimationFrame(loop);
      }
      function updateSpeedLabel() { const v=Number(speed.value); speedValue.textContent = v < 105 ? 'سريعة' : v > 175 ? 'هادئة' : 'متوسطة'; }
      document.addEventListener('keydown', e => {
        const map={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
        if (map[e.key]) { e.preventDefault(); ai.checked=false; setDirection(map[e.key]); updateStatus(); }
        if (e.key===' ') { e.preventDefault(); pause.click(); }
      });
      restart.addEventListener('click',reset);
      pause.addEventListener('click',()=>{ if(!running) return reset(); paused=!paused; pause.textContent=paused?'متابعة':'إيقاف مؤقت'; updateStatus(); });
      ai.addEventListener('change',()=>{ if(!running) reset(); updateStatus(); });
      speed.addEventListener('input',updateSpeedLabel);
      let touchStart;
      canvas.addEventListener('pointerdown', e=>{ touchStart={x:e.clientX,y:e.clientY}; });
      canvas.addEventListener('pointerup', e=>{ if(!touchStart) return; const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y; if(Math.max(Math.abs(dx),Math.abs(dy))>20){ ai.checked=false; setDirection(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')); updateStatus(); } touchStart=null; });
      updateSpeedLabel(); reset(); requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
